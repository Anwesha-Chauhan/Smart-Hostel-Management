
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Management - Smart Hostel</title>
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .visitor-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
        }

        .visitor-form {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .visitor-form label {
            display: block;
            margin: 15px 0 7px;
            font-weight: 600;
        }

        .visitor-form input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .visitor-form button {
            margin-top: 18px;
            padding: 11px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .visitor-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .visitor-table th,
        .visitor-table td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        .visitor-table th {
            background: #f2f2f2;
        }

        .visitor-table button {
            padding: 7px 10px;
            margin: 3px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .visitor-message {
            margin-top: 15px;
            font-weight: 600;
        }

        .summary {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .summary-card {
            background: white;
            padding: 18px;
            border-radius: 8px;
            min-width: 140px;
        }
    </style>
</head>

<body>

<div class="visitor-container">

    <h2>Visitor Management</h2>
    <p>Register visitors, monitor entries and manage check-outs.</p>

    <div class="summary">
        <div class="summary-card">
            <h3 id="totalVisitors">0</h3>
            <p>Total Visitors</p>
        </div>

        <div class="summary-card">
            <h3 id="activeVisitors">0</h3>
            <p>Currently Inside</p>
        </div>

        <div class="summary-card">
            <h3 id="checkedOut">0</h3>
            <p>Checked Out</p>
        </div>
    </div>

    <div class="visitor-form">
        <h3>Register New Visitor</h3>

        <form id="visitorForm">

            <label for="studentId">Student ID</label>
            <input
                type="number"
                id="studentId"
                name="studentId"
                min="1"
                required
            >

            <label for="visitorName">Visitor Name</label>
            <input
                type="text"
                id="visitorName"
                name="visitorName"
                maxlength="100"
                required
            >

            <label for="relation">Relation to Student</label>
            <input
                type="text"
                id="relation"
                name="relation"
                maxlength="50"
                placeholder="Parent, Brother, Friend, etc."
                required
            >

            <button type="submit" class="action" id="registerButton">
                Register Visitor
            </button>

            <p id="message" class="visitor-message"></p>

        </form>
    </div>

    <h3>Visitor Records</h3>

    <div class="table-wrapper">
        <table class="visitor-table">
            <thead>
                <tr>
                    <th>Visitor ID</th>
                    <th>Student ID</th>
                    <th>Student Name</th>
                    <th>Visitor Name</th>
                    <th>Relation</th>
                    <th>Check-in</th>
                    <th>Check-out</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="visitorTableBody">
                <tr>
                    <td colspan="8">Loading visitor records...</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    const visitorForm = document.getElementById("visitorForm");
    const message = document.getElementById("message");
    const registerButton = document.getElementById("registerButton");
    const tableBody = document.getElementById("visitorTableBody");

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, function (char) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char];
        });
    }

    async function loadVisitors() {
        try {
            const response = await fetch("/api/visitors", {
                credentials: "same-origin",
                cache: "no-store"
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || "Could not load visitors.");
            }

            const visitors = data.visitors || [];

            const active = visitors.filter(v => !v.checkOut).length;
            const checkedOut = visitors.length - active;

            document.getElementById("totalVisitors").textContent =
                visitors.length;

            document.getElementById("activeVisitors").textContent =
                active;

            document.getElementById("checkedOut").textContent =
                checkedOut;

            if (visitors.length === 0) {
                tableBody.innerHTML =
                    '<tr><td colspan="8">No visitor records found.</td></tr>';
                return;
            }

            tableBody.innerHTML = visitors.map(visitor => `
                <tr>
                    <td>${escapeHTML(visitor.visitorId)}</td>
                    <td>${escapeHTML(visitor.studentId)}</td>
                    <td>${escapeHTML(visitor.studentName)}</td>
                    <td>${escapeHTML(visitor.visitorName)}</td>
                    <td>${escapeHTML(visitor.relation)}</td>
                    <td>${escapeHTML(visitor.checkIn)}</td>
                    <td>${escapeHTML(visitor.checkOut || "Not checked out")}</td>
                    <td>
                        ${
                            visitor.checkOut
                            ? "Completed"
                            : `<button type="button"
                                onclick="checkoutVisitor(${Number(visitor.visitorId)})">
                                Check Out
                               </button>`
                        }

                        <button type="button"
                            onclick="deleteVisitor(${Number(visitor.visitorId)})">
                            Delete
                        </button>
                    </td>
                </tr>
            `).join("");

        } catch (error) {
            tableBody.innerHTML =
                '<tr><td colspan="8">Could not load visitor records.</td></tr>';

            console.error(error);
        }
    }

    visitorForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        registerButton.disabled = true;
        message.textContent = "Registering visitor...";

        try {
            const formData = new URLSearchParams();

            formData.append(
                "studentId",
                document.getElementById("studentId").value
            );

            formData.append(
                "visitorName",
                document.getElementById("visitorName").value.trim()
            );

            formData.append(
                "relation",
                document.getElementById("relation").value.trim()
            );

            const response = await fetch("/api/visitors/register", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: formData
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || "Registration failed.");
            }

            message.textContent = "Visitor registered successfully!";
            visitorForm.reset();

            await loadVisitors();

        } catch (error) {
            message.textContent = error.message;
        } finally {
            registerButton.disabled = false;
        }
    });

    async function checkoutVisitor(visitorId) {
        if (!confirm("Are you sure you want to check out this visitor?"))
            return;

        await performVisitorAction(
            "/api/visitors/checkout",
            visitorId
        );
    }

    async function deleteVisitor(visitorId) {
        if (!confirm("Are you sure you want to delete this visitor record?"))
            return;

        await performVisitorAction(
            "/api/visitors/delete",
            visitorId
        );
    }

    async function performVisitorAction(url, visitorId) {
        try {
            const formData = new URLSearchParams();
            formData.append("visitorId", visitorId);

            const response = await fetch(url, {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: formData
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || "Operation failed.");
            }

            message.textContent = data.message;
            await loadVisitors();

        } catch (error) {
            message.textContent = error.message;
        }
    }

    loadVisitors();
</script>

</body>
</html>
