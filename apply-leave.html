
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Leave - Smart Hostel</title>
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .leave-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .leave-form {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .leave-form label {
            display: block;
            margin: 15px 0 7px;
            font-weight: 600;
        }

        .leave-form input,
        .leave-form textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .leave-form textarea {
            min-height: 100px;
            resize: vertical;
        }

        .leave-form button {
            margin-top: 18px;
            padding: 11px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .leave-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .leave-table th,
        .leave-table td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        .leave-table th {
            background: #f2f2f2;
        }

        .leave-message {
            margin-top: 15px;
            font-weight: 600;
        }

        .table-wrapper {
            overflow-x: auto;
        }
    </style>
</head>

<body>

<div class="leave-container">

    <h2>Apply for Leave</h2>
    <p>Submit your leave application and track its approval status.</p>

    <div class="leave-form">
        <h3>New Leave Application</h3>

        <form id="leaveForm">

            <label for="fromDate">From Date</label>
            <input type="date" id="fromDate" name="fromDate" required>

            <label for="toDate">To Date</label>
            <input type="date" id="toDate" name="toDate" required>

            <label for="reason">Reason for Leave</label>
            <textarea
                id="reason"
                name="reason"
                maxlength="1000"
                placeholder="Enter your reason for leave..."
                required
            ></textarea>

            <button type="submit" class="action" id="submitButton">
                Submit Application
            </button>

            <p id="message" class="leave-message"></p>

        </form>
    </div>

    <h3>My Leave Applications</h3>

    <div class="table-wrapper">
        <table class="leave-table">
            <thead>
                <tr>
                    <th>Leave ID</th>
                    <th>From Date</th>
                    <th>To Date</th>
                    <th>Reason</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="leaveTableBody">
                <tr>
                    <td colspan="5">Loading leave requests...</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    const leaveForm = document.getElementById("leaveForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");
    const tableBody = document.getElementById("leaveTableBody");

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, function (char) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char];
        });
    }

    async function loadLeaveRequests() {
        try {
            const response = await fetch("/api/leave/requests", {
                method: "GET",
                credentials: "same-origin",
                cache: "no-store"
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || "Could not load leave requests.");
            }

            const requests = data.requests || [];

            if (requests.length === 0) {
                tableBody.innerHTML =
                    '<tr><td colspan="5">No leave applications found.</td></tr>';
                return;
            }

            tableBody.innerHTML = requests.map(request => `
                <tr>
                    <td>${escapeHTML(request.leaveId)}</td>
                    <td>${escapeHTML(request.fromDate)}</td>
                    <td>${escapeHTML(request.toDate)}</td>
                    <td>${escapeHTML(request.reason)}</td>
                    <td>${escapeHTML(request.status)}</td>
                </tr>
            `).join("");

        } catch (error) {
            tableBody.innerHTML =
                '<tr><td colspan="5">Could not load leave requests.</td></tr>';
            console.error(error);
        }
    }

    leaveForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const fromDate = document.getElementById("fromDate").value;
        const toDate = document.getElementById("toDate").value;
        const reason = document.getElementById("reason").value.trim();

        if (fromDate > toDate) {
            message.textContent = "To Date cannot be earlier than From Date.";
            return;
        }

        if (!reason) {
            message.textContent = "Please enter a reason for leave.";
            return;
        }

        submitButton.disabled = true;
        message.textContent = "Submitting application...";

        try {
            const formData = new URLSearchParams();
            formData.append("fromDate", fromDate);
            formData.append("toDate", toDate);
            formData.append("reason", reason);

            const response = await fetch("/api/leave/apply", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: formData
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || "Could not submit application.");
            }

            message.textContent = "Leave application submitted successfully!";
            leaveForm.reset();

            await loadLeaveRequests();

        } catch (error) {
            message.textContent = error.message;
        } finally {
            submitButton.disabled = false;
        }
    });

    loadLeaveRequests();
</script>

</body>
</html>
