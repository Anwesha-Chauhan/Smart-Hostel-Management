
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Hostel Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f6f1;
        }

        .login-container {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #247447;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #777;
            font-size: 14px;
        }

        .login-container h2 {
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5ded7;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #247447;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #247447;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .login-btn:hover {
            background: #185b35;
        }

        .footer-text {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <h1>Smart Hostel</h1>
            <p>Hostel Management System</p>
        </div>

        <h2>Welcome Back!</h2>
        <p class="subtitle">Sign in to access your account.</p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Sign In
            </button>

        </form>

        <p id="loginMessage"
           style="text-align:center; margin-top:15px; font-size:14px;">
        </p>

        <p class="footer-text">
            Smart Hostel Management System
        </p>

    </div>

    <script>

        const loginForm = document.getElementById("loginForm");
        const loginMessage = document.getElementById("loginMessage");

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            loginMessage.style.color = "#777";
            loginMessage.textContent = "Verifying credentials...";

            try {

                const response = await fetch("/api/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },

                    body: new URLSearchParams({
                        email: email,
                        password: password
                    })

                });

                const result = await response.json();

                // Check whether login failed
                if (!response.ok || !result.success) {

                    loginMessage.style.color = "#c0392b";

                    loginMessage.textContent =
                        result.message || "Invalid email or password.";

                    return;
                }

                // Login successful
                loginMessage.style.color = "#247447";

                loginMessage.textContent =
                    "Login successful! Redirecting...";

                // Redirect to dashboard
                window.location.href =
                    result.redirect || "/index.html";

            }

            catch (error) {

                loginMessage.style.color = "#c0392b";

                loginMessage.textContent =
                    "Unable to connect to the server.";

                console.error("Login error:", error);

            }

        });

    </script>

</body>
</html>
