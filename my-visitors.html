
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Visitors - Smart Hostel</title>
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .visitor-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .summary {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin: 25px 0;
        }

        .summary-card {
            background: white;
            padding: 18px;
            border-radius: 8px;
            min-width: 140px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .visitor-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .visitor-table th,
        .visitor-table td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        .visitor-table th {
            background: #f2f2f2;
        }
    </style>
</head>

<body>

<div class="visitor-container">

    <h2>My Visitors</h2>
    <p>View visitor records associated with your hostel account.</p>

    <div class="summary">
        <div class="summary-card">
            <h3 id="totalVisitors">0</h3>
            <p>Total Visitors</p>
        </div>

        <div class="summary-card">
            <h3 id="activeVisitors">0</h3>
            <p>Currently Inside</p>
        </div>

        <div class="summary-card">
            <h3 id="checkedOut">0</h3>
            <p>Checked Out</p>
        </div>
    </div>

    <h3>Visitor History</h3>

    <div class="table-wrapper">
        <table class="visitor-table">
            <thead>
                <tr>
                    <th>Visitor ID</th>
                    <th>Visitor Name</th>
                    <th>Relation</th>
                    <th>Check-in</th>
                    <th>Check-out</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="visitorTableBody">
                <tr>
                    <td colspan="6">Loading visitor records...</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, function(char) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char];
        });
    }

    async function loadMyVisitors() {
        const tableBody = document.getElementById("visitorTableBody");

        try {
            const response = await fetch("/api/student/visitors", {
                method: "GET",
                credentials: "same-origin",
                cache: "no-store"
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || "Could not load visitor records.");
            }

            const visitors = data.visitors || [];

            const active = visitors.filter(v => !v.checkOut).length;
            const checkedOut = visitors.length - active;

            document.getElementById("totalVisitors").textContent =
                visitors.length;

            document.getElementById("activeVisitors").textContent =
                active;

            document.getElementById("checkedOut").textContent =
                checkedOut;

            if (visitors.length === 0) {
                tableBody.innerHTML =
                    '<tr><td colspan="6">No visitors registered for your account.</td></tr>';
                return;
            }

            tableBody.innerHTML = visitors.map(visitor => `
                <tr>
                    <td>${escapeHTML(visitor.visitorId)}</td>
                    <td>${escapeHTML(visitor.visitorName)}</td>
                    <td>${escapeHTML(visitor.relation)}</td>
                    <td>${escapeHTML(visitor.checkIn)}</td>
                    <td>${escapeHTML(visitor.checkOut || "Not checked out")}</td>
                    <td>${visitor.checkOut ? "Checked Out" : "Currently Inside"}</td>
                </tr>
            `).join("");

        } catch (error) {
            tableBody.innerHTML =
                '<tr><td colspan="6">Could not load visitor records.</td></tr>';

            console.error(error);
        }
    }

    loadMyVisitors();
</script>

</body>
</html>
